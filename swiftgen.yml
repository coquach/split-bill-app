plist:
    inputs: SplitPay/Info.plist
    outputs:
    - templateName: runtime-swift5
      output: SplitPay/Generated/Info.swift
strings:
  inputs: Foundation/Design/Sources/Design/Supporting/en.lproj/Localizable.strings
  filter: .+\.strings$

  outputs:
    - templateName: structured-swift5
      params:
        publicAccess: true
      output: Foundation/Design/Sources/Design/Generated/Strings.swift

xcassets:
  inputs:
    - Foundation/Design/Sources/Design/Supporting/Images.xcassets
    - Foundation/Design/Sources/Design/Supporting/Colors.xcassets

  outputs:
    - templateName: swift5
      output: Foundation/Design/Sources/Design/Generated/Assets.swift
      params:
        publicAccess: true
