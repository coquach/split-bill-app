# CI: checks every change before it is merged.
#
#   pull request  ->  lint + build + unit tests            (fast, about 10 minutes)
#   push to develop/main, or run by hand
#                 ->  the above + UI tests                 (slower, about 20 minutes)
#
# release.yml also calls this workflow, so a release is only built from code that passed.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

# A new push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    # Advisory for now: the existing code still has style warnings.
    # Remove this line once they are fixed to make lint a hard requirement.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  unit-tests:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The app targets the iOS 26 SDK, so use the newest Xcode 26 on the runner.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version

      # Debug.xcconfig includes this git-ignored file. Placeholder values are fine:
      # unit tests use mocks and UI tests use an in-memory backend.
      - name: Create Secrets.xcconfig
        run: cp SplitPay/Config/Secrets.xcconfig.example SplitPay/Config/Secrets.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .spm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Proves the whole app (and every package it uses) compiles.
      - name: Build the app
        run: |
          xcodebuild build \
            -project SplitPay.xcodeproj \
            -scheme SplitPay \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO

      # Runs the tests of every package, one by one, and prints a PASS/FAIL summary.
      - name: Run unit tests
        run: ./scripts/run_tests.sh

  ui-tests:
    name: UI tests
    # Slow, so not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Create Secrets.xcconfig
        run: cp SplitPay/Config/Secrets.xcconfig.example SplitPay/Config/Secrets.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .spm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The app runs against the in-memory mock backend, so no network or account is needed.
      - name: Run UI tests
        run: ./scripts/run_ui_tests.sh

      - name: Upload the test log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-log
          path: /tmp/splitpay-ui-tests.log
